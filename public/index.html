<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Mail Console</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <!-- Auth Gate Overlay -->
  <div id="password-gate" class="password-gate">
    <div class="gate-card">
      <div class="gate-icon">🔒</div>
      <h2>Authorized Access Only</h2>
      <p>Enter administrative passkey to access console</p>
      <form id="auth-form">
        <div class="form-group">
          <input type="password" id="gate-password" placeholder="Passkey" required autofocus>
        </div>
        <div id="gate-error" class="gate-error hidden">Invalid authorization key</div>
        <button type="submit" class="btn btn-primary btn-block">Unlock Console</button>
      </form>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app-content" class="app-container hidden">
    <header class="app-header">
      <h1>✉️ Secure Mail Console</h1>
      <button id="btn-logout" class="btn-logout">Logout</button>
    </header>

    <div class="dashboard-grid">
      <!-- Composer Column -->
      <div class="card composer-card">
        <form id="mailer-form">
          
          <!-- 1. Sender Display Name (Name First) -->
          <div class="form-group">
            <label for="sender-name">Sender Display Name</label>
            <input type="text" id="sender-name" placeholder="John Doe">
          </div>

          <!-- 2. Sender Gmail (ID Second) -->
          <div class="form-group">
            <label for="sender-email">Sender Gmail</label>
            <input type="email" id="sender-email" placeholder="user@gmail.com" required>
          </div>

          <!-- 3. App Password (Password Third) -->
          <div class="form-group">
            <label for="app-password">App Password (16-char)</label>
            <div class="password-wrapper">
              <input type="password" id="app-password" placeholder="xxxx xxxx xxxx xxxx" required>
              <button type="button" id="toggle-app-pass" class="icon-button">👁️</button>
            </div>
          </div>

          <!-- Subject Line -->
          <div class="form-group">
            <label for="subject-line">Subject Line (Supports Spintax & Tags)</label>
            <input type="text" id="subject-line" placeholder="{Hello|Hi} {Name}, important update" required>
          </div>

          <!-- Message Body -->
          <div class="form-group flex-grow">
            <label for="message-body">Message Content (HTML/Text)</label>
            <textarea id="message-body" placeholder="Hi {FirstName},&#10;&#10;Here is your message body..." required></textarea>
          </div>

        </form>
      </div>

      <!-- Controls & Recipients Column -->
      <div class="right-column">
        <div class="card recipients-card">
          <div class="card-header-flex">
            <label for="recipients-input">Recipients List</label>
            <span id="recipient-count-badge" class="badge">0 Total</span>
          </div>
          <p class="help-subtext">Formats: email@domain.com, "Name" &lt;email@domain.com&gt;, or CSV</p>
          <textarea id="recipients-input" placeholder="john@example.com&#10;Jane Doe &lt;jane@example.com&gt;" required></textarea>
        </div>

        <div class="card stats-card">
          <div class="stats-grid">
            <div class="stat-box neutral">
              <span class="stat-label">Total</span>
              <span id="stat-total" class="stat-value">0</span>
            </div>
            <div class="stat-box success">
              <span class="stat-label">Sent</span>
              <span id="stat-sent" class="stat-value">0</span>
            </div>
            <div class="stat-box danger">
              <span class="stat-label">Failed</span>
              <span id="stat-failed" class="stat-value">0</span>
            </div>
            <div class="stat-box warning">
              <span class="stat-label">Remaining</span>
              <span id="stat-remaining" class="stat-value">0</span>
            </div>
          </div>

          <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
          </div>

          <div id="status-indicator" class="status-indicator">Ready</div>

          <div class="cf-turnstile" data-sitekey="1x0000000000000000000000000000000AA" data-callback="onTurnstileSuccess"></div>

          <div class="control-buttons">
            <button id="btn-start" class="btn btn-primary flex-1">Start Sending</button>
            <button id="btn-stop" class="btn btn-danger flex-1" disabled>Stop</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
